[package]
name = "nsis-plugin"
version = "0.1.0"
include = [
    "/src",
    "/README.md",
    "/LICENSE-MIT",
    "/LICENSE-APACHE",
]
autoexamples = false
description = "Write NSIS plug-ins in Rust, correct across every NSIS build variant"
homepage = "https://github.com/idleberg/nsis-plugin"
documentation = "https://docs.rs/nsis-plugin"
readme = "README.md"
keywords = [
    "nsis",
    "plugin",
    "installer",
    "windows",
    "ffi",
]
categories = [
    "api-bindings",
    "os::windows-apis",
    "no-std",
]

[package.edition]
workspace = true

[package.rust-version]
workspace = true

[package.authors]
workspace = true

[package.license]
workspace = true

[package.repository]
workspace = true

[package.metadata.docs.rs]
all-features = false
targets = [
    "x86_64-pc-windows-msvc",
    "i686-pc-windows-msvc",
]

[features]
ansi = []
default = [
    "unicode",
    "mem-intrinsics",
]
mem-intrinsics = []
std = []
testing = []
unicode = []

[workspace]
members = [
    ".",
    "examples/hello",
    "my-plugin",
    "xtask",
]
resolver = "3"

[workspace.package]
authors = ["Jan T. Sott"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/idleberg/nsis-plugin"
edition = "2024"
rust-version = "1.85"

[workspace.dependencies.nsis-plugin]
version = "0.1.0"
path = "."
default-features = false

[profile.release]
opt-level = "z"
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
