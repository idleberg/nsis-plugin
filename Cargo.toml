[package]
name = "nsis-plugin"
version = "0.1.0"
description = "Write NSIS plug-ins in Rust, correct across every NSIS build variant"
documentation = "https://docs.rs/nsis-plugin"
homepage = "https://github.com/idleberg/nsis-plugin"
keywords = ["nsis", "plugin", "installer", "windows", "ffi"]
categories = ["api-bindings", "os::windows-apis", "no-std"]
readme = "README.md"
include = ["/src", "/README.md", "/LICENSE-MIT", "/LICENSE-APACHE"]
# `examples/hello` is a workspace member with its own manifest, not a cargo example.
autoexamples = false
authors.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[features]
default = ["unicode", "mem-intrinsics"]

# Character width. Mutually exclusive; see `Tchar`.
unicode = []
ansi = []

# Provide `memcpy`/`memset`/`memmove`/`memcmp` so a plug-in can link with
# `-nodefaultlibs`. Turn off if you link against a CRT that already has them.
mem-intrinsics = []

# Opt into `std` (bigger DLL, but `std` types and `catch_unwind` are available).
std = []

# The `TestInstaller` harness, for testing plug-in logic on macOS and Linux.
testing = []

[package.metadata.docs.rs]
all-features = false
targets = ["x86_64-pc-windows-msvc", "i686-pc-windows-msvc"]

[workspace]
members = [".", "examples/hello", "xtask"]
resolver = "3"

[workspace.package]
authors = ["Jan T. Sott"]
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/idleberg/nsis-plugin"
rust-version = "1.85"

[workspace.dependencies]
nsis-plugin = { path = ".", version = "0.1.0", default-features = false }

# Shared by every plug-in cdylib in this workspace. The template ships the same
# profile, because a plug-in DLL is embedded in every installer built with it.
[profile.release]
opt-level = "z"
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
