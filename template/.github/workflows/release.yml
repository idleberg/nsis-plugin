name: Release

on:
  release:
    types: [published]

jobs:
  plugin:
    runs-on: windows-latest

    permissions:
      contents: write
      id-token: write
      attestations: write

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: nsis-dev/release-package@489fbb8cb19ff58dfd029c50b5cc0c5d693e576f # v0.4.1
        with:
          name: {{crate_name}}
          project: Cargo.toml
          toolchain: rust
          targets: x86-ansi,x86-unicode,amd64-unicode
