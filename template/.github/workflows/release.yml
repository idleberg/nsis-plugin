name: Release

on:
  release:
    types: [published]

jobs:
  plugin:
    runs-on: windows-latest

    permissions:
      contents: write
      id-token: write
      attestations: write

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: nsis-dev/release-package@cde8e8f889db320207fe80d3bd90fe63922d680f # v0.2.0
        with:
          name: {{crate_name}}
          project: Cargo.toml
          toolchain: rust
          targets: x86-ansi,x86-unicode,amd64-unicode
