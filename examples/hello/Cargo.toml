[package]
name = "hello"
version = "0.1.0"
description = "Minimal nsis-plugin example, doubling as the smoke test"
publish = false
authors.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[lib]
# The DLL file name is the plug-in namespace in a script: `hello::Add`.
name = "hello"
crate-type = ["cdylib"]

[dependencies]
nsis-plugin = { workspace = true, features = ["mem-intrinsics"] }

[dev-dependencies]
# Enables the fake-installer harness for `cargo test` only, so it never lands
# in a shipped DLL.
nsis-plugin = { workspace = true, features = ["testing"] }

[features]
default = ["unicode"]
unicode = ["nsis-plugin/unicode"]
ansi = ["nsis-plugin/ansi"]
