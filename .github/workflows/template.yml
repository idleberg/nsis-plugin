name: Template

# The raw template does not build: its files hold cargo-generate placeholders.
# Generate a plug-in, point it at this checkout's crate and run the generated
# project's own CI steps against it, so a crate change that breaks the template
# fails here rather than after the next release.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ci-check

    steps:
      - name: Check out the crate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: crate

      - name: Install cargo-generate
        working-directory: .
        run: cargo install --locked cargo-generate

      # Next to the checkout, not inside it: inside, the crate's workspace
      # would claim the generated package.
      - name: Generate a plug-in
        working-directory: .
        run: >
          cargo generate --path crate/template --name ci-check --silent
          --define plugin_description=CI --define author=CI

      - name: Use this checkout's crate
        run: printf '\n[patch.crates-io]\nnsis-plugin = { path = "../crate" }\n' >> Cargo.toml

      - name: Set up mise
        uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1
        with:
          working_directory: ci-check

      - name: Install mingw-w64 and Wine
        run: |
          sudo dpkg --add-architecture i386
          sudo apt-get update
          sudo apt-get install -y mingw-w64 wine wine32

      - name: Set up NSIS
        uses: nsis-dev/setup-nsis@99783963764acafc24a5e3335ddfce26d03c20a2 # v1.2.1

      - name: Cache Rust build
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: ci-check

      - name: Run checks
        run: |
          rustup component add rustfmt clippy
          mise run checks

      - name: Build every variant
        run: mise run dist

      - name: Check size budget
        run: mise run size

      - name: Smoke test
        env:
          WINEDEBUG: -all
        run: mise run smoke

      - name: Show the log
        if: always()
        run: cat dist/smoke/smoke.log || true
